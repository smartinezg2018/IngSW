{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet" />

    <style>
        :root {
            --bg: #f7f8fc;
            --card: #fff;
            --ring: #e5e7eb;
        }

        body {
            background: radial-gradient(1200px 600px at 20% 0%, #f1f5ff 0%, var(--bg) 45%, var(--bg) 100%);
        }

        .brand {
            font-weight: 800;
            letter-spacing: .3px;
        }

        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid var(--ring);
            position: sticky;
            top: 0;
        }

        .sidebar .nav-link {
            border-radius: 12px;
            color: #475569;
            font-weight: 600;
            transition: .15s background-color, .15s transform;
        }

        .sidebar .nav-link:hover {
            background: #f4f6ff;
            transform: translateX(2px);
        }

        .sidebar .nav-link.active {
            background: #eef2ff;
            color: #4338ca;
        }

        .card-soft {
            background: #fff;
            border: 1px solid var(--ring);
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(16, 24, 40, .05);
        }

        .form-control,
        .form-select {
            border-radius: 12px;
        }

        .btn-cta {
            border-radius: 12px;
            padding: .75rem 1.25rem;
            font-weight: 600;
        }

        .hint {
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar (lg+) -->
        <aside class="sidebar p-3 d-none d-lg-block">
            <div class="d-flex align-items-center gap-2 mb-4 ps-1">
                <i class="bi bi-hexagon-fill text-primary"></i>
                <span class="brand">Dashboard<span class="text-muted">.v01</span></span>
            </div>
            <nav class="nav flex-column gap-1">
                <a class="nav-link px-3 {% if request.resolver_match.url_name == 'comments' %}active{% endif %}"
                    href="{% url 'dashboard:comments' %}">
                    <i class="bi bi-chat-dots me-2"></i>Comments
                </a>
                <a class="nav-link px-3 {% if request.resolver_match.url_name == 'forms' %}active{% endif %}"
                    href="{% url 'dashboard:forms' %}">
                    <i class="bi bi-file-earmark-plus me-2"></i>Posts
                </a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="flex-grow-1">
            <div class="container-fluid py-4">
                <!-- Top bar with mobile menu -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h4 class="fw-bold mb-0">Create Post</h4>
                    <button class="btn btn-outline-secondary d-lg-none" data-bs-toggle="offcanvas"
                        data-bs-target="#mobileNav">
                        <i class="bi bi-list"></i>
                    </button>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8 col-xl-6">
                        <div class="card-soft p-4 p-md-5">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <h5 class="fw-bold mb-0">Post information</h5>
                                <span class="badge text-bg-light">Create</span>
                            </div>

                            <form id="customerForm" method="post" enctype="multipart/form-data" action="{% url 'dashboard:save_forms' %}">
                                {% csrf_token %}

                                <div class="mb-3">
                                    <label for="description" class="form-label fw-semibold">Whole Description <span
                                            class="text-danger">*</span></label>
                                    <textarea class="form-control" id="description" name="description" rows="5" required
                                        placeholder="Write the full post description here..."></textarea>
                                    <div class="form-text hint">This is the long form body for the post.</div>
                                </div>

                                <div class="mb-3">
                                    <label for="cedula" class="form-label fw-semibold">Post Caption</label>
                                    <input type="text" class="form-control" id="cedula" name="cedula"
                                        placeholder="A short catchy caption" />
                                </div>

                                <div class="mb-4">
                                    <label for="customerImage" class="form-label fw-semibold">Image (only jpg accepted)
                                        <span class="text-danger">*</span></label>
                                    <input type="file" class="form-control" id="customerImage" name="customer_image"
                                        accept="image/jpeg" required />
                                    <div class="form-text hint">Upload a JPG image.</div>
                                </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-dark btn-lg px-4" id="checkout">
                                    <i class="fas fa-save me-2"></i>Post
                                </button>
                            </div>
                            </form>
                        </div>
                        <p class="text-center text-muted small mt-3">Need help? <a href="#"
                                class="text-decoration-none">Visit docs</a></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile offcanvas nav -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="nav flex-column gap-1">
                <a class="nav-link {% if request.resolver_match.url_name == 'comments' %}active{% endif %}"
                    href="{% url 'dashboard:comments' %}">
                    <i class="bi bi-chat-dots me-2"></i>Comments
                </a>
                <a class="nav-link {% if request.resolver_match.url_name == 'forms' %}active{% endif %}"
                    href="{% url 'dashboard:forms' %}">
                    <i class="bi bi-file-earmark-plus me-2"></i>Posts
                </a>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/forms_script.js' %}"></script>
</body>

</html>
